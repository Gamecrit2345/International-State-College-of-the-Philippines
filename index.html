<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISCP Bulacan Registration</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #001f3f, #003366);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      padding: 40px 25px;
      width: 100%;
      max-width: 580px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      text-align: center;
    }

    h1 { font-size: 2.3em; margin-bottom: 8px; }
    h2 { color: #a0d8ff; margin-bottom: 30px; font-weight: 500; }

    label { display: block; margin: 15px 0 5px; font-weight: 500; color: #a0d8ff; text-align: left; }
    input, select {
      width: 100%; padding: 14px 16px; margin-bottom: 15px;
      border: none; border-radius: 10px; font-size: 1.05em;
      background: rgba(255,255,255,0.92); color: #001f3f;
    }

    button {
      width: 100%; padding: 16px; margin-top: 20px;
      background: white; color: #001f3f; border: none;
      border-radius: 10px; font-size: 1.2em; font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #00ccff; }

    .footer {
      margin-top: 35px;
      font-size: 0.85em;
      color: #a0d8ff;
      line-height: 1.5;
    }

    #langSelect {
      margin: 30px 0;
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#001f3f; display:flex; align-items:center; justify-content:center; z-index:9999;">
    <div style="text-align:center;">
      <div style="width:60px; height:60px; border:6px solid #ffffff33; border-top:6px solid white; border-radius:50%; animation:spin 1s linear infinite; margin:auto;"></div>
      <p style="margin-top:20px;">Loading ISCP System...</p>
    </div>
  </div>

  <div class="container" id="mainContent" style="display:none;">
    <h1 id="title">ISCP BULACAN</h1>
    <h2 id="subtitle">ONLINE REGISTRATION 2026</h2>

    <div id="langSelect">
      <button onclick="setLanguage('en')" style="width:auto; padding:10px 25px; margin:0 10px;">English</button>
      <button onclick="setLanguage('tl')" style="width:auto; padding:10px 25px; margin:0 10px;">Tagalog</button>
    </div>

    <form id="regForm">
      <label id="label-name">Full Name</label>
      <input type="text" id="name" placeholder="Juan Dela Cruz" required>

      <label id="label-email">Email Address</label>
      <input type="email" id="email" placeholder="example@gmail.com or @yahoo.com" required>

      <label id="label-campus">Preferred Campus</label>
      <select id="campus" required>
        <!-- Same campuses as before -->
        <option value="">-- Select Campus --</option>
        <option value="Bulacan Campus">Bulacan Campus</option>
        <option value="Bataan Campus">Bataan Campus</option>
        <option value="Pampanga Campus">Pampanga Campus</option>
        <option value="Moon Campus">Moon Campus</option>
        <!-- ... add the rest if you want -->
      </select>

      <label id="label-course">Course/Program</label>
      <select id="course" required>
        <option value="">-- Select Course --</option>
        <option value="BS Computer Science">BS Computer Science</option>
        <option value="BS Nursing">BS Nursing</option>
        <!-- Add more -->
      </select>

      <button type="submit" id="submitBtn">Submit Registration</button>
    </form>

    <div class="footer">
      This is only satire. This website is for entertainment purposes only.<br>
      Created by Denton Sagmayao<br>
      ISCPHILIPPINES.com
    </div>
  </div>

  <script>
    // Loading
    window.onload = () => {
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
      }, 1800);
    };

    // Language Function
    function setLanguage(lang) {
      if (lang === 'en') {
        document.getElementById('title').innerText = "ISCP BULACAN";
        document.getElementById('subtitle').innerText = "ONLINE REGISTRATION 2026";
        document.getElementById('label-name').innerText = "Full Name";
        document.getElementById('label-email').innerText = "Email Address";
        document.getElementById('label-campus').innerText = "Preferred Campus";
        document.getElementById('label-course').innerText = "Course/Program";
        document.getElementById('submitBtn').innerText = "Submit Registration";
      } else {
        document.getElementById('title').innerText = "ISCP BULACAN";
        document.getElementById('subtitle').innerText = "ONLINE REGISTRATION 2026";
        document.getElementById('label-name').innerText = "Buong Pangalan";
        document.getElementById('label-email').innerText = "Email Address";
        document.getElementById('label-campus').innerText = "Preferred Campus";
        document.getElementById('label-course').innerText = "Kurso/Programa";
        document.getElementById('submitBtn').innerText = "Isumite ang Registration";
      }
    }

    // Form Submit
    document.getElementById('regForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert("✅ Registration Successful!\n\nThank you for applying to ISCP Bulacan!\n\n(Fake site only)");
      this.reset();
    });
  </script>
</body>
</html>
