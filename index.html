<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISCP Bulacan - Online Registration</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #001f3f, #003366);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      padding: 40px 30px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }

    h1 { font-size: 2.4em; text-align: center; margin-bottom: 5px; }
    h2 { text-align: center; color: #a0d8ff; margin-bottom: 35px; font-weight: 500; }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: 500;
      color: #a0d8ff;
    }

    input, select {
      width: 100%;
      padding: 14px 16px;
      margin: 8px 0 16px 0;
      border: none;
      border-radius: 10px;
      font-size: 1.05em;
      background: rgba(255,255,255,0.92);
      color: #001f3f;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 25px;
      background: white;
      color: #001f3f;
      border: none;
      border-radius: 10px;
      font-size: 1.2em;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #00ccff; transform: scale(1.03); }

    .footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.85em;
      color: #a0d8ff;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>ISCP BULACAN</h1>
    <h2>ONLINE REGISTRATION</h2>

    <form id="regForm">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Juan Dela Cruz" required>

      <label>Email Address</label>
      <input type="email" id="email" placeholder="example@gmail.com or @yahoo.com" required>

      <label>Preferred Campus</label>
      <select id="campus" required>
        <option value="">-- Select Campus --</option>
        <option value="Bulacan Campus">Bulacan Campus</option>
        <option value="Bataan Campus">Bataan Campus</option>
        <option value="Pampanga Campus">Pampanga Campus</option>
        <option value="Main Campus">Main Campus</option>
        <option value="Moon Campus">Moon Campus</option>
        <option value="Mars Outpost Campus">Mars Outpost Campus</option>
        <option value="Low Earth Orbit Campus">Low Earth Orbit Campus</option>
      </select>

      <label>Course / Program</label>
      <select id="course" required>
        <option value="">-- Select Course --</option>
        <option value="BS Computer Science">BS Computer Science</option>
        <option value="BS Nursing">BS Nursing</option>
        <option value="BS Education">BS Education</option>
        <option value="BS Business Administration">BS Business Administration</option>
        <option value="BS Criminology">BS Criminology</option>
        <option value="BS Agriculture">BS Agriculture</option>
        <option value="BS Civil Engineering">BS Civil Engineering</option>
      </select>

      <label>Phone Number</label>
      <input type="tel" id="phone" placeholder="09XXXXXXXXX" required>

      <label>Last School Attended</label>
      <input type="text" id="school" placeholder="e.g. Bulacan National High School" required>

      <button type="submit">Submit Registration</button>
    </form>

    <div class="footer">
      This is only satire. This website is for entertainment purposes only.<br>
      Created by Denton Sagmayao<br>
      ISCPHILIPPINES.com
    </div>
  </div>

  <script>
    document.getElementById('regForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = this.querySelector('button');
      btn.innerHTML = "Processing...";
      btn.disabled = true;

      setTimeout(() => {
        alert("✅ Registration Successful!\n\nThank you for applying to ISCP Bulacan Campus!\n\n(This is only a fake/satire website)");
        this.reset();
        btn.innerHTML = "Submit Registration";
        btn.disabled = false;
      }, 2000);
    });
  </script>
</body>
</html>
