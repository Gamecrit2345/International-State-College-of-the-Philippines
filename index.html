<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTERNATIONAL STATE COLLEGE OF THE PHILIPPINES - Online Registration</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
   
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #001f3f, #003366);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      padding: 40px 30px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }
    h1 { 
      font-size: 2.1em; 
      text-align: center; 
      margin-bottom: 5px; 
      line-height: 1.2;
    }
    h2 { text-align: center; color: #a0d8ff; margin-bottom: 30px; font-weight: 500; }
    label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: 500; color: #a0d8ff; }
    input, select {
      width: 100%; padding: 14px 16px; margin: 8px 0 16px 0;
      border: none; border-radius: 10px; font-size: 1.05em;
      background: rgba(255,255,255,0.92); color: #001f3f;
    }
    button {
      width: 100%; padding: 16px; margin-top: 25px;
      background: white; color: #001f3f; border: none;
      border-radius: 10px; font-size: 1.2em; font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #00ccff; }
    .footer { margin-top: 40px; text-align: center; font-size: 0.85em; color: #a0d8ff; line-height: 1.6; }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#001f3f;display:flex;align-items:center;justify-content:center;z-index:9999;">
    <div style="text-align:center;">
      <div style="width:60px;height:60px;border:6px solid #ffffff33;border-top:6px solid white;border-radius:50%;animation:spin 1s linear infinite;margin:auto;"></div>
      <p style="margin-top:20px;">Loading ISCP System...</p>
    </div>
  </div>
  <div class="container" id="mainContent" style="display:none;">
    <h1 id="title">INTERNATIONAL STATE COLLEGE OF THE PHILIPPINES</h1>
    <h2 id="subtitle">ONLINE REGISTRATION</h2>
    <div style="margin:25px 0;">
      <button onclick="setLanguage('en')" style="padding:10px 20px;margin:0 8px;">🇬🇧 English</button>
      <button onclick="setLanguage('tl')" style="padding:10px 20px;margin:0 8px;">🇵🇭 Tagalog</button>
    </div>
    <form id="regForm">
      <label id="label-fname">First Name</label>
      <input type="text" id="fname" placeholder="Juan" required>
      <label id="label-mname">Middle Name (Optional)</label>
      <input type="text" id="mname" placeholder="Santos">
      <label id="label-lname">Surname / Last Name</label>
      <input type="text" id="lname" placeholder="Dela Cruz" required>
      <label id="label-email">Email Address</label>
      <input type="email" id="email" placeholder="example@gmail.com or @yahoo.com" required>
      <label id="label-campus">Preferred Campus</label>
      <select id="campus" required>
        <option value="">-- Select Campus --</option>
        <option value="Area 51 Extension">Area 51 Extension</option>
        <option value="Atlantis Extension">Atlantis Extension</option>
        <option value="Baguio Cold Storage Campus">Baguio Cold Storage Campus</option>
        <option value="Bataan Campus">Bataan Campus</option>
        <option value="Bermuda Triangle Campus">Bermuda Triangle Campus</option>
        <option value="Black Hole Campus">Black Hole Campus</option>
        <option value="Bulacan Campus">Bulacan Campus</option>
        <option value="Center of the Earth Campus">Center of the Earth Campus</option>
        <option value="Chernobyl Extension">Chernobyl Extension</option>
        <option value="Cloud 9 Campus">Cloud 9 Campus</option>
        <option value="Deep Ocean Campus">Deep Ocean Campus</option>
        <option value="DJ Loonyo Int'l Airport Extension">DJ Loonyo Int'l Airport Extension</option>
        <option value="Encantadia Extension">Encantadia Extension</option>
        <option value="Fourth Wall Campus">Fourth Wall Campus</option>
        <option value="Gaslight Campus">Gaslight Campus</option>
        <option value="Jupiter Campus">Jupiter Campus</option>
        <option value="Low Earth Orbit Campus">Low Earth Orbit Campus</option>
        <option value="Main Campus">Main Campus</option>
        <option value="Marilao–Bulacan Satellite Campus">Marilao–Bulacan Satellite Campus</option>
        <option value="Mars Outpost Campus">Mars Outpost Campus</option>
        <option value="Mirror Dimension Campus">Mirror Dimension Campus</option>
        <option value="Moon Campus">Moon Campus</option>
        <option value="Pampanga Campus">Pampanga Campus</option>
        <option value="Parallel Universe Campus">Parallel Universe Campus</option>
        <option value="Sun Campus">Sun Campus</option>
        <option value="Time Travel Campus">Time Travel Campus</option>
        <option value="Underwater Campus">Underwater Campus</option>
        <option value="Upside Down Campus">Upside Down Campus</option>
        <option value="Virtual Reality Campus">Virtual Reality Campus</option>
      </select>
      <label id="label-course">Course / Program</label>
      <select id="course" required>
        <option value="">-- Select Course --</option>
        <option value="BS Accountancy">BS Accountancy</option>
        <option value="BS Agriculture">BS Agriculture</option>
        <option value="BS Architecture">BS Architecture</option>
        <option value="BS Aviation">BS Aviation</option>
        <option value="BS Biology">BS Biology</option>
        <option value="BS Business Administration">BS Business Administration</option>
        <option value="BS Chemical Engineering">BS Chemical Engineering</option>
        <option value="BS Civil Engineering">BS Civil Engineering</option>
        <option value="BS Computer Science">BS Computer Science</option>
        <option value="BS Criminology">BS Criminology</option>
        <option value="BS Education">BS Education</option>
        <option value="BS Electrical Engineering">BS Electrical Engineering</option>
        <option value="BS Environmental Science">BS Environmental Science</option>
        <option value="BS Information Technology">BS Information Technology</option>
        <option value="BS Law">BS Law</option>
        <option value="BS Marine Biology">BS Marine Biology</option>
        <option value="BS Mechanical Engineering">BS Mechanical Engineering</option>
        <option value="BS Medicine">BS Medicine</option>
        <option value="BS Memes & Internet Studies">BS Memes & Internet Studies</option>
        <option value="BS Nursing">BS Nursing</option>
        <option value="BS Pharmacy">BS Pharmacy</option>
        <option value="BS Psychology">BS Psychology</option>
        <option value="BS Quantum Physics">BS Quantum Physics</option>
        <option value="BS Tourism">BS Tourism</option>
        <option value="BS Time Travel Engineering">BS Time Travel Engineering</option>
        <option value="BS Intergalactic Relations">BS Intergalactic Relations</option>
      </select>
      <label id="label-phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="09XXXXXXXXX" required>
      <label id="label-school">Last School Attended</label>
      <input type="text" id="school" placeholder="e.g. Bulacan National High School" required>
      <button type="submit" id="submitBtn">Submit Registration</button>
    </form>
    <div class="footer">
      This is only satire. This website is for entertainment purposes only.<br>
      Created by Denton Sagmayao<br>
      ISCPHILIPPINES.com
    </div>
  </div>
  <script>
    window.onload = () => {
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
      }, 1600);
    };
    function setLanguage(lang) {
      if (lang === 'en') {
        document.getElementById('title').innerText = "INTERNATIONAL STATE COLLEGE OF THE PHILIPPINES";
        document.getElementById('subtitle').innerText = "ONLINE REGISTRATION";
        document.getElementById('label-fname').innerText = "First Name";
        document.getElementById('label-mname').innerText = "Middle Name (Optional)";
        document.getElementById('label-lname').innerText = "Surname / Last Name";
        document.getElementById('label-email').innerText = "Email Address";
        document.getElementById('label-campus').innerText = "Preferred Campus";
        document.getElementById('label-course').innerText = "Course / Program";
        document.getElementById('label-phone').innerText = "Phone Number";
        document.getElementById('label-school').innerText = "Last School Attended";
        document.getElementById('submitBtn').innerText = "Submit Registration";
      } else {
        document.getElementById('title').innerText = "INTERNATIONAL STATE COLLEGE OF THE PHILIPPINES";
        document.getElementById('subtitle').innerText = "ONLINE REGISTRATION";
        document.getElementById('label-fname').innerText = "First Name";
        document.getElementById('label-mname').innerText = "Middle Name (Kung mayroon)";
        document.getElementById('label-lname').innerText = "Apelyido";
        document.getElementById('label-email').innerText = "Email Address";
        document.getElementById('label-campus').innerText = "Preferred Campus";
        document.getElementById('label-course').innerText = "Kurso / Programa";
        document.getElementById('label-phone').innerText = "Numero ng Telepono";
        document.getElementById('label-school').innerText = "Huling Paaralan na Pinasukan";
        document.getElementById('submitBtn').innerText = "Isumite ang Registration";
      }
    }
    document.getElementById('regForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = this.querySelector('button');
      btn.innerHTML = "Processing...";
      btn.disabled = true;
      setTimeout(() => {
        alert("✅ Registration Successful!\n\nThank you for applying to INTERNATIONAL STATE COLLEGE OF THE PHILIPPINES!\n\n(Fake site only)");
        this.reset();
        btn.innerHTML = "Submit Registration";
        btn.disabled = false;
      }, 2000);
    });
  </script>
</body>
</html>
